<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matebase · pruebas del núcleo</title>
<!-- Con marca de tiempo: si el navegador sirviera un CSS cacheado, las medidas
     de esta página (recortes, barras de scroll) estarían midiendo otra cosa. -->
<script>
  document.write(['base', 'layout', 'components', 'math'].map(function (n) {
    return '<link rel="stylesheet" href="assets/css/' + n + '.css?t=' + Date.now() + '">';
  }).join(''));
</script>
<style>
  body{padding:28px; max-width:900px; margin:0 auto}
  h1{font-size:26px; margin-bottom:4px}
  .lead{color:var(--ink-soft); margin-bottom:22px}
  .res{font-family:var(--mono); font-size:13.5px; line-height:1.9}
  .ok{color:var(--ok)} .ko{color:var(--bad)}
  .sum{font-size:19px; font-weight:650; padding:14px 18px; border-radius:12px; margin:18px 0}
  .sum.pass{background:var(--ok-soft); color:var(--ok)}
  .sum.fail{background:var(--bad-soft); color:var(--bad)}
  .grp{margin:18px 0 6px; font-weight:650; font-size:15px}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
  .gallery div{border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:var(--panel)}
  .gallery code{display:block; font-size:10.5px; color:var(--ink-faint); margin-bottom:6px;
    background:none; border:0; padding:0; word-break:break-all}
</style>
</head>
<body>

<h1>Pruebas del núcleo</h1>
<p class="lead">Ábrelo con doble clic después de tocar <code>mathx.js</code>, <code>mathlib.js</code>
o <code>widgets.js</code>. Si algo se rompe, sale aquí en rojo.</p>

<div id="sum"></div>
<div id="out" class="res"></div>

<div class="grp">Temas del curso</div>
<div id="temas" class="res">comprobando…</div>

<div class="grp">Muestrario del renderizador</div>
<div id="gal" class="gallery"></div>

<!-- El núcleo se carga con antichaché: al probar interesa siempre la última
     versión de cada archivo, nunca la que tenga guardada el navegador.
     document.write mantiene el orden de ejecución, que aquí es obligatorio. -->
<script>
  (function () {
    var t = '?t=' + Date.now();
    ['core/util', 'core/mathx', 'core/mathlib', 'core/widgets', 'core/progress',
     'core/shader', 'core/exercise', 'core/page', 'core/repaso', 'curriculum',
     'glosario'].forEach(function (f) {
      document.write('<script src="assets/js/' + f + '.js' + t + '"><\/script>');
    });
  })();
</script>
<script>
(function () {
  var pass = 0, fail = 0, out = document.getElementById('out'), grp = '';

  function group(g) { grp = g; out.innerHTML += '<div class="grp">' + g + '</div>'; }
  function ok(name) { pass++; out.innerHTML += '<div class="ok">✓ ' + name + '</div>'; }
  function ko(name, got, want) {
    fail++;
    out.innerHTML += '<div class="ko">✗ ' + name + ' → obtuve <b>' + got + '</b>, esperaba <b>' + want + '</b></div>';
  }
  function eq(name, got, want, tol) {
    var good = (typeof want === 'number' && typeof got === 'number')
      ? Math.abs(got - want) <= (tol === undefined ? 1e-9 : tol)
      : String(got) === String(want);
    good ? ok(name) : ko(name, got, want);
  }
  function truthy(name, v) { v ? ok(name) : ko(name, v, 'algo verdadero'); }

  /* ---------------- mathlib: enteros ---------------- */
  group('mathlib · aritmética entera');
  eq('gcd(84,36)', ML.gcd(84, 36), 12);
  eq('lcm(4,6)', ML.lcm(4, 6), 12);
  eq('mcd de lista', ML.gcdList([12, 18, 30]), 6);
  eq('mcm de lista', ML.lcmList([4, 6, 10]), 60);
  truthy('97 es primo', ML.isPrime(97));
  truthy('91 no es primo', !ML.isPrime(91));
  truthy('1 no es primo', !ML.isPrime(1));
  eq('factorización de 360', ML.factorTex(360), '2^{3} \\cdot 3^{2} \\cdot 5');
  eq('divisores de 28', ML.divisors(28).join(','), '1,2,4,7,14,28');
  eq('criba hasta 20', ML.primesUpTo(20).join(','), '2,3,5,7,11,13,17,19');
  eq('C(10,3)', ML.comb(10, 3), 120);
  eq('V(5,2)', ML.perm(5, 2), 20);
  eq('6!', ML.factorial(6), 720);

  /* ---------------- mathlib: fracciones ---------------- */
  group('mathlib · fracciones exactas');
  var a = ML.F(3, 4), b = ML.F(5, 6);
  eq('3/4 + 5/6', a.add(b).toString(), '19/12');
  eq('3/4 − 5/6', a.sub(b).toString(), '-1/12');
  eq('3/4 · 5/6', a.mul(b).toString(), '5/8');
  eq('3/4 : 5/6', a.div(b).toString(), '9/10');
  eq('se simplifica sola', ML.F(6, 8).toString(), '3/4');
  eq('el signo sube al numerador', ML.F(3, -4).toString(), '-3/4');
  eq('LaTeX de −3/4', ML.F(-3, 4).tex(), '-\\frac{3}{4}');
  eq('(2/3)^-2', ML.F(2, 3).pow(-2).toString(), '9/4');
  eq('decimal 0,5 → fracción', ML.F(0.5).toString(), '1/2');
  eq('decimal 0,125 → fracción', ML.F(0.125).toString(), '1/8');
  eq('decimal 1,6 → fracción', ML.F(1.6).toString(), '8/5');
  eq('decimal −0,2 → fracción', ML.F(-0.2).toString(), '-1/5');
  eq('entero 3', ML.F(3).toString(), '3');

  /* ---------------- mathlib: polinomios ---------------- */
  group('mathlib · polinomios');
  eq('x²−3x+2', ML.polyTex([1, -3, 2]), 'x^{2}-3x+2');
  eq('coeficiente nulo se salta', ML.polyTex([2, 0, -5]), '2x^{2}-5');
  eq('valor numérico', ML.polyEval([1, -3, 2], 5), 12);
  eq('producto', ML.polyMul([1, 2], [1, -2]).join(','), '1,0,-4');
  eq('suma de distinto grado', ML.polyAdd([1, 2, 3], [4, 5]).join(','), '1,6,8');
  var ruf = ML.ruffini([1, -6, 11, -6], 1);
  eq('Ruffini · cociente', ruf.q.join(','), '1,-5,6');
  eq('Ruffini · resto', ruf.rest, 0);
  eq('raíces enteras', ML.intRoots([1, -6, 11, -6]).join(','), '1,2,3');
  eq('raíz x=0 incluida', ML.intRoots([1, -3, 2, 0]).join(','), '0,1,2');
  var q = ML.quadratic(1, -5, 6);
  eq('2.º grado · nº de raíces', q.n, 2);
  eq('2.º grado · raíz mayor', Math.max(q.x1, q.x2), 3);
  eq('discriminante nulo', ML.quadratic(1, -4, 4).n, 1);
  eq('sin solución real', ML.quadratic(1, 0, 4).n, 0);
  eq('√12 simplificada', ML.sqrtTex(12), '2\\sqrt{3}');
  eq('√49 = 7', ML.sqrtTex(49), '7');
  eq('√7 no simplifica', ML.sqrtTex(7), '\\sqrt{7}');

  /* ---------------- mathlib: matrices y sistemas ---------------- */
  group('mathlib · matrices y sistemas');
  eq('determinante 2×2', ML.det2([[1, 2], [3, 4]]), -2);
  eq('determinante 3×3', ML.det3([[1, 2, 3], [4, 5, 6], [7, 8, 10]]), -3);
  var s2 = ML.solve2(1, 1, 5, 1, -1, 1);
  eq('sistema compatible · x', s2.x, 3);
  eq('sistema compatible · y', s2.y, 2);
  eq('sistema incompatible', ML.solve2(1, 1, 5, 2, 2, 3).type, 'ninguna');
  eq('sistema indeterminado', ML.solve2(1, 1, 5, 2, 2, 10).type, 'infinitas');

  /* ---------------- mathlib: estadística ---------------- */
  group('mathlib · estadística');
  var D = [2, 4, 4, 4, 5, 5, 7, 9];
  eq('media', ML.mean(D), 5);
  eq('desviación típica', ML.sd(D), 2);
  eq('mediana', ML.median(D), 4.5);
  eq('moda', ML.mode(D).join(','), '4');
  eq('N(0,1) en 0', ML.normalCdf(0), 0.5, 1e-3);
  eq('N(0,1) en 1,96', ML.normalCdf(1.96), 0.975, 1e-3);
  eq('correlación perfecta', ML.corr([1, 2, 3, 4], [2, 4, 6, 8]), 1, 1e-9);

  /* ---------------- mathlib: evaluador de respuestas ---------------- */
  group('mathlib · evaluador de lo que teclea el alumno');
  [['3/4', 0.75], ['-2,5', -2.5], ['2^10', 1024], ['sqrt(2)', Math.SQRT2],
   ['sqrt9', 3], ['log2(8)', 3], ['log(100)', 2], ['ln(e)', 1],
   ['pi/6', Math.PI / 6], ['2(3+4)', 14], ['(1+2)(3+4)', 21], ['-2^2', -4],
   ['2^3^2', 512], ['|-5|', 5], ['25%', 0.25], ['5!', 120], ['6:2', 3],
   ['3·4', 12], ['2π', 2 * Math.PI], ['3²', 9], ['abs(-3)+2', 5]
  ].forEach(function (t) { eq('«' + t[0] + '»', ML.tryEval(t[0], {}), t[1], 1e-9); });
  eq('con variable', ML.tryEval('2x+1', { x: 3 }), 7);
  eq('producto implícito', ML.tryEval('(x-3)(x+3)', { x: 5 }), 16);
  truthy('reconoce (x−3)(x+3) = x²−9', ML.equivalent('(x-3)(x+3)', 'x^2-9'));
  truthy('rechaza (x−3)(x+3) = x²+9', !ML.equivalent('(x-3)(x+3)', 'x^2+9'));
  truthy('equivalencia con dos letras', ML.equivalent('a^2-b^2', '(a-b)(a+b)', ['a', 'b']));
  truthy('basura → NaN', isNaN(ML.tryEval('hola')));

  /* ---------------- mathx ---------------- */
  group('mathx · renderizador');
  var TEX = [
    'x^2+3x-4=0', '\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}', '\\sqrt[3]{27}=3',
    '\\int_0^1 x^2\\,dx=\\frac{1}{3}', '\\sum_{i=1}^{n} i=\\frac{n(n+1)}{2}',
    '\\lim_{x\\to 0}\\frac{\\operatorname{sen} x}{x}=1', '\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}',
    '\\begin{cases}2x+y=5\\\\x-y=1\\end{cases}', '\\vec{v}=(3,-4),\\ |\\vec{v}|=5',
    '\\mathbb{R}\\setminus\\{0\\}', "f'(x)=2x", '\\log_2 8 = 3',
    '\\frac{\\partial f}{\\partial x}', '\\overline{x}=\\frac{\\sum x_i}{n}',
    '\\left(\\frac{1}{2}\\right)^{3}', '30^\\circ = \\frac{\\pi}{6}\\ \\text{rad}',
    'P(A|B)=\\frac{P(A\\cap B)}{P(B)}', '\\binom{n}{k}', 'e^{i\\pi}+1=0',
    '\\begin{aligned}2x+y&=5\\\\x-y&=1\\end{aligned}',
    '\\begin{array}{cc}1&2\\\\3&4\\end{array}',
    '\\left|\\frac{x}{2}\\right|', '\\left\\{x\\in\\mathbb{R}: x>0\\right\\}',
    '\\hat{y}=ax+b', '\\dot{x}=\\lambda x', '\\nabla\\cdot\\vec{F}',
    'x\\pmod 7', '\\left.\\frac{x^2}{2}\\right|_0^1', '\\Delta = b^2-4ac',
    '\\frac{dy}{dx}+P(x)y=Q(x)',
    '3 \\mid 12 \\Longleftrightarrow 12 = 3k',
    '\\underbrace{a+a+a}_{3 \\text{ veces}}',
    '3^{2x}-4\\cdot3^x+3=0 \\xrightarrow{t=3^x} t^2-4t+3=0',
    'f:\\mathbb{R}\\longmapsto\\mathbb{R}',
    '\\left(\\begin{array}{ccc|c} 1 & 2 & -1 & 3 \\\\ 0 & 1 & 2 & 4 \\end{array}\\right)',
    '\\begin{aligned} 2x+y &= 7 \\\\ x-y &= 2 \\\\ \\hline 3x &= 9\\end{aligned}',
    '\\lim_{x \\to 0} \\frac{\\operatorname{sen} x}{x} \\overset{0/0}{=} \\lim_{x \\to 0} \\frac{\\cos x}{1} = 1'
  ];
  var errores = 0;
  TEX.forEach(function (t) { if (MathX.render(t).indexOf('mx-err') >= 0) { errores++; ko('comando desconocido', t, '—'); } });
  if (!errores) ok(TEX.length + ' fórmulas sin comandos desconocidos');
  truthy('los paréntesis crecen con una fracción dentro',
    MathX.render('\\left(\\frac{1}{2}\\right)').indexOf('scaleY(1.95)') >= 0);
  truthy('los paréntesis normales no se estiran',
    MathX.render('\\left(x+1\\right)').indexOf('scaleY(1.2)') >= 0);
  truthy('$...$ en línea', MathX.inline('vale $x^2$ aquí').indexOf('mx-var') >= 0);
  truthy('texto sin $ se deja intacto', MathX.inline('nada de mates') === 'nada de mates');

  /* ---------------- glosario ---------------- */
  /* Estuvo vacio por una coma que faltaba y nadie se entero, porque estas
     pruebas no lo cargaban. Ahora se mira. */
  group('glosario');
  truthy('el glosario se carga', !!window.GLOSARIO && GLOSARIO.length > 0);
  if (window.GLOSARIO) {
    var glosOk = true, glosSinDef = 0, glosSinTema = 0, glosVistos = {}, glosRepes = [];
    GLOSARIO.forEach(function (e) {
      if (!e.t || typeof e.t !== 'string') glosOk = false;
      if (!e.d || e.d.length < 40) glosSinDef++;
      if (!e.i) glosSinTema++;
      var k = e.t.toLowerCase();
      if (glosVistos[k]) glosRepes.push(e.t); else glosVistos[k] = 1;
    });
    truthy('todas las entradas tienen término', glosOk);
    eq('entradas sin definición seria', glosSinDef, 0);
    truthy('no hay términos repetidos', glosRepes.length === 0);
    /* Cada entrada dice en qué tema se explica: ese tema tiene que existir. */
    var glosIds = {};
    CURRICULUM.forEach(function (b2) { b2.temas.forEach(function (t) { glosIds[t.id] = 1; }); });
    var glosHuerfanas = [];
    GLOSARIO.forEach(function (e) { if (e.i && !glosIds[e.i]) glosHuerfanas.push(e.t + ' → ' + e.i); });
    if (glosHuerfanas.length) ko('cada entrada apunta a un tema real', glosHuerfanas.join(', '), 'temas del temario');
    else ok('cada entrada apunta a un tema real (' + GLOSARIO.length + ' entradas)');
  }

  /* ---------------- contraste de la paleta ---------------- */
  /* Un curso no se lee con el color que uno elige, sino con el que puede
     ver quien lo lee. Se mide de verdad, en los tres temas. */
  group('contraste de los tres temas');
  (function () {
    function rgb(v) {
      var m = /(-?\d+)[,\s]+(-?\d+)[,\s]+(-?\d+)/.exec(v);
      if (m) return [+m[1], +m[2], +m[3]];
      m = /^#?([0-9a-f]{6})$/i.exec(v.trim());
      if (!m) return null;
      var h = m[1];
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function lum(c) {
      var f = function (x) {
        x /= 255;
        return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
      };
      return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
    }
    function contraste(a, b) {
      var la = lum(a), lb = lum(b);
      return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    }
    var parejas = [
      ['--ink', '--panel', 'texto sobre tarjeta'],
      ['--ink-soft', '--bg', 'texto secundario'],
      ['--ink-faint', '--panel', 'apuntes tenues'],
      ['--ink-faint', '--bg-alt', 'apuntes tenues en el índice'],
      ['--accent', '--bg', 'enlaces'],
      ['--ok', '--ok-soft', 'veredicto de acierto'],
      ['--bad', '--bad-soft', 'veredicto de fallo'],
      ['--warn', '--warn-soft', 'pista'],
      ['--tip-ink', '--tip', 'globo de ayuda'],
      ['--on-accent', '--accent', 'texto del botón principal']
    ];
    /* El coloreado del código se lee sobre dos fondos: el del editor y el de
       los recuadros de los enunciados. Los dos tienen que pasar, o habrá un
       tema en el que los comentarios se pierdan. */
    [['--cod-com', 'comentarios'], ['--cod-key', 'palabras clave'],
     ['--cod-typ', 'tipos'], ['--cod-num', 'números'],
     ['--cod-fun', 'funciones'], ['--cod-uni', 'valores de fuera'],
     ['--cod-pre', 'preprocesador'], ['--cod-pun', 'signos']
    ].forEach(function (c) {
      parejas.push([c[0], '--bg-alt', 'código · ' + c[1] + ' en el editor']);
      parejas.push([c[0], '--panel-2', 'código · ' + c[1] + ' en el enunciado']);
    });
    var raiz = document.documentElement;
    var previo = raiz.getAttribute('data-theme');
    ['light', 'dark', 'monokai'].forEach(function (tema) {
      raiz.setAttribute('data-theme', tema);
      var cs = getComputedStyle(raiz);
      parejas.forEach(function (par) {
        var a = rgb(cs.getPropertyValue(par[0])), b = rgb(cs.getPropertyValue(par[1]));
        if (!a || !b) { ko(tema + ' · ' + par[2], 'sin color', 'dos colores'); return; }
        var c = contraste(a, b);
        if (c >= 4.5) ok(tema + ' · ' + par[2] + ' (' + c.toFixed(2) + ':1)');
        else ko(tema + ' · ' + par[2], c.toFixed(2) + ':1', '4.5:1 o más');
      });
    });
    if (previo) raiz.setAttribute('data-theme', previo); else raiz.removeAttribute('data-theme');
  })();

  /* ---------------- widgets y ejercicios ---------------- */
  group('widgets y motor de ejercicios');
  var host = document.createElement('div');
  document.body.appendChild(host);
  host.style.display = 'none';
  var plot = W.plot(host, { xmin: -5, xmax: 5, ymin: -5, ymax: 5, height: 200, draw: function (g) { g.fn(Math.sin); } });
  truthy('Plot2D crea un canvas', !!host.querySelector('canvas'));
  eq('transformación de coordenadas', plot.iX(plot.X(2.5)), 2.5, 1e-6);
  var hh = W.plot(host, { handles: { A: { x: 1, y: 2 } }, draw: function (g) { g.point(g.h('A').x, g.h('A').y); } });
  truthy('los puntos arrastrables existen en el primer pintado', hh.h('A').x === 1);
  var nl = W.numberLine(host, { min: 0, max: 10, handles: { P: { x: 3, y: 0 } }, draw: function () { } });
  truthy('la recta real hereda los puntos', !!nl.h('P'));
  W.barChart(host, { labels: ['a', 'b'], values: [3, 5] });
  truthy('el diagrama de barras se construye', host.querySelectorAll('canvas').length >= 3);

  /* --- deslizadores: los continuos se afinan solos --- */
  group('deslizadores y encuadre de las gráficas');
  var sFino = W.slider(host, { label: 'a', min: -3, max: 3, step: 0.5, value: 1, dec: 1 });
  truthy('un paso fraccionario se afina (0,5 → ≤0,02)', parseFloat(sFino.input.step) <= 0.02);
  var sEntero = W.slider(host, { label: 'n', min: 1, max: 10, step: 1, value: 5, dec: 0 });
  eq('un paso entero se respeta', parseFloat(sEntero.input.step), 1);
  var sDefecto = W.slider(host, { label: 'x', min: 0, max: 1, value: 0.5 });
  truthy('sin paso indicado también sale fino', parseFloat(sDefecto.input.step) <= 0.01);
  W.slider(host, { label: 'p', min: 0.001, max: 0.3, step: 0.001, value: 0.01, dec: 3 });
  truthy('no se reducen los decimales que ya pedía el autor',
    host.querySelectorAll('.ctrl').length >= 4);

  /* --- encuadre 1:1 sin recortar --- */
  var anc = U.el('div');
  anc.style.cssText = 'position:absolute;left:-9999px;width:800px';
  document.body.appendChild(anc);
  var pEq = W.board(anc, { xmin: -1.5, xmax: 1.5, ymin: -1.5, ymax: 1.5, height: 300, draw: function () { } });
  truthy('con escala 1:1 la ventana pedida cabe entera en vertical',
    pEq.ymin <= -1.5 + 1e-9 && pEq.ymax >= 1.5 - 1e-9);
  truthy('con escala 1:1 la ventana pedida cabe entera en horizontal',
    pEq.xmin <= -1.5 + 1e-9 && pEq.xmax >= 1.5 - 1e-9);
  var escX = pEq.W / (pEq.xmax - pEq.xmin), escY = pEq.H / (pEq.ymax - pEq.ymin);
  eq('la escala es realmente la misma en los dos ejes', escX, escY, 1e-6);
  pEq.resize(); pEq.resize();
  truthy('redimensionar no descuadra el encuadre',
    pEq.ymin <= -1.5 + 1e-9 && pEq.ymax >= 1.5 - 1e-9);
  anc.remove();

  /* --- temas --- */
  group('temas');
  var raiz = document.documentElement;
  var previo = raiz.getAttribute('data-theme');
  ['light', 'dark', 'monokai'].forEach(function (t) {
    raiz.setAttribute('data-theme', t);
    var p = U.palette();
    truthy('el tema «' + t + '» define fondo, tinta y seis colores de serie',
      !!p.bg && !!p.ink && p.c.length === 6 && p.c.every(function (c) { return !!c; }));
  });
  raiz.setAttribute('data-theme', 'monokai');
  var mk = U.palette();
  raiz.setAttribute('data-theme', 'dark');
  var dk = U.palette();
  truthy('monokai no es una copia del tema oscuro', mk.bg !== dk.bg && mk.accent !== dk.accent);
  raiz.setAttribute('data-theme', previo || 'light');

  /* --- caja de fórmula con etiqueta --- */
  var hf = document.createElement('div');
  var pf = new Page(hf, { id: '__fbox' });
  pf.formula('x^2', 'una etiqueta');
  pf.formula('y^2');
  truthy('la fórmula con etiqueta reserva hueco arriba',
    hf.querySelectorAll('.fbox--lab').length === 1);
  truthy('la fórmula sin etiqueta no lo reserva',
    hf.querySelectorAll('.fbox').length === 2);

  group('motor de ejercicios');
  var card = Ex.card(host, {
    title: 'prueba', gen: function (r) { return { a: r.int(2, 9) }; },
    ask: function (d) { return 'doble de ' + d.a; },
    fields: [{ name: 'v', label: 'v' }],
    sol: function (d) { return { v: 2 * d.a }; }
  }, '__test', 1);
  var q1 = card.data.a;
  card.regen();
  truthy('«Otro ejercicio» genera datos nuevos', typeof card.data.a === 'number');
  card.inputs.v.input.value = String(2 * card.data.a);
  card.check();

  /* ---------------- cada tema del temario se construye sin romperse ----------------
     Se cargan todos los archivos de topics/ que existan y se monta cada
     pagina en un contenedor oculto. Asi un fallo en un tema sale aqui y
     no cuando el alumno lo abre.                                          */
  (function () {
    var box = document.getElementById('temas');
    var ids = [];
    (window.CURRICULUM || []).forEach(function (b) {
      b.temas.forEach(function (t) { ids.push(t); });
    });
    var reg = {}, pend = ids.length, escritos = 0, conPuntos = 0;
    var idsCurso = {};
    ids.forEach(function (x) { idsCurso[x.id] = 1; });   // ids guarda objetos, no cadenas
    var existe = {};        // el archivo se descargó (aunque luego no se registre)
    window.Course = { topic: function (id, fn) { reg[id] = fn; } };
    if (!pend) { box.textContent = 'sin temario'; return; }

    ids.forEach(function (t) {
      var s = document.createElement('script');
      // antichaché: al probar interesa siempre la última versión del archivo
      s.src = 'topics/' + t.id + '.js?t=' + Date.now();
      // onload significa «el archivo existe»: si además tiene un error de
      // sintaxis, el navegador lo carga igual y simplemente no llega a
      // registrarse. Distinguir los dos casos evita que un tema roto pase
      // por «todavía sin escribir».
      s.onload = function () { existe[t.id] = true; if (--pend === 0) build(); };
      s.onerror = function () { if (--pend === 0) build(); };

    /* Auditoría de un ejercicio procedimental:
       se genera 40 veces y se comprueba que la solución que el propio
       ejercicio declara pasa su propio corrector, que nada revienta y
       que no queda ninguna fórmula con comandos LaTeX inexistentes.
       Un problema por apartados se audita apartado a apartado, con los
       mismos datos para todos, que es como lo ve el alumno. */
    function auditarUnidad(u, d, c) {
      var textos = [];
      if (u.ask) textos.push(u.ask(d));
      if (u.hint) {
        var hh = u.hint(d);
        textos = textos.concat(Array.isArray(hh) ? hh : [hh]);
        if (Array.isArray(hh) && !hh.length) c.otros.push('una lista de pistas vacía');
      }
      if (u.answer) textos.push(u.answer(d));
      if (u.steps) textos = textos.concat(u.steps(d));
      var flds = (typeof u.fields === 'function' ? u.fields(d) : u.fields) || [];
      flds.forEach(function (f) {
        textos.push(String(f.label || ''));
        if (f.opts) Ex.opciones(f).forEach(function (o) { textos.push(o.t); });
      });
      textos.forEach(function (t) {
        if (MathX.inline(String(t)).indexOf('mx-err') >= 0) c.malTex++;
      });
      if (!u.sol) return;

      var want = u.sol(d), v = { raw: {} };
      for (var k in want) {
        v[k] = (typeof want[k] === 'number') ? want[k] : ML.tryEval(String(want[k]));
        /* La coma decimal solo tiene sentido si la respuesta es un
           numero: si es texto -codigo GLSL, por ejemplo- cambiar el
           punto por una coma lo estropea. */
        v.raw[k] = (typeof want[k] === 'number')
          ? String(want[k]).replace('.', ',')
          : String(want[k]);
      }
      var res = u.check ? u.check(v, d) : Ex.compara(u, v, want);
      if (res && typeof res === 'object') res = res.ok;
      if (!res) c.malCheck++;

      /* Si el enunciado pide N decimales, una respuesta bien redondeada
         tiene hasta medio decimal de error. Con la tolerancia relativa
         de Ex.same, cerca de cero eso se rechaza: el ejercicio tiene que
         declarar `dec` (o corregir a medida). */
      if (!u.check && u.dec === undefined && u.rel === undefined && u.ask) {
        var pide = String(u.ask(d)).toLowerCase()
          .match(/\b(un|uno|dos|tres|cuatro|cinco|seis|\d)\s+decimal/);
        if (pide) {
          var N = { un: 1, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6 }[pide[1]] || +pide[1];
          var t = u.tol === undefined ? 1e-6 : u.tol;
          if (t < 0.5 * Math.pow(10, -N)) c.decimales = N;
        }
      }

      /* En un campo de elección, la solución tiene que ser una de las
         opciones que se ofrecen: si no, el ejercicio es imposible. */
      flds.forEach(function (f) {
        if (!f.opts || want[f.name] === undefined) return;
        var vals = Ex.opciones(f).map(function (o) { return o.v; });
        if (vals.indexOf(String(want[f.name])) < 0) c.malOpc++;
      });

      /* Un «error típico» que salta con la respuesta correcta le diría al
         alumno que ha fallado cuando ha acertado. */
      (u.errores || []).forEach(function (er) {
        try { if (er.si(v, d)) c.malErr++; } catch (e) { c.malErr++; }
      });

      /* Un corrector de texto libre que acepta cualquier cosa es peor
         que no tener corrector: el alumno cree que ha acertado. Se le
         dan dos respuestas sin contenido y ninguna debe pasar. */
      if (u.check && /v\.raw/.test(String(u.check))) {
        ['', 'no lo sé'].forEach(function (basura) {
          var w = { raw: {} }, tocado = 0;
          for (var k2 in want) {
            w[k2] = (typeof want[k2] === 'number') ? want[k2] : ML.tryEval(String(want[k2]));
            w.raw[k2] = (typeof want[k2] === 'number')
              ? String(want[k2]).replace('.', ',')
              : String(want[k2]);
          }
          flds.forEach(function (f) {
            if (typeof want[f.name] === 'string') {
              w.raw[f.name] = basura; w[f.name] = NaN; tocado++;
            }
          });
          // Si el ejercicio no tiene ningún campo de texto que estropear,
          // esta prueba no dice nada: saltarla en vez de dar un falso aviso.
          if (!tocado) return;
          var r2 = u.check(w, d);
          if (r2 && typeof r2 === 'object') r2 = r2.ok;
          if (r2) c.tragaTodo++;
        });
      }
    }

    function auditar(specs) {
      var fallos = [];
      (specs || []).forEach(function (s, idx) {
        var etiqueta = (s.partes ? 'problema ' : 'ej.') + (idx + 1) + ' («' + (s.title || '') + '»)';
        var c = { malCheck: 0, malTex: 0, tragaTodo: 0, malOpc: 0, malErr: 0, decimales: 0, otros: [] };
        var excep = '';
        if (s.partes && !s.partes.length) excep = 'un problema sin apartados';
        for (var i = 0; i < 40 && !excep; i++) {
          var d = null, guard = 0;
          try {
            do { d = s.gen ? s.gen(U.rng()) : {}; } while (d === null && ++guard < 60);
            if (d === null) { excep = excep || 'gen() nunca devuelve datos'; break; }
            if (s.partes) {
              var intro = s.intro ? s.intro(d) : '';
              if (MathX.inline(String(intro)).indexOf('mx-err') >= 0) c.malTex++;
              s.partes.forEach(function (pt) { auditarUnidad(pt, d, c); });
            } else {
              auditarUnidad(s, d, c);
            }
          } catch (e) { excep = e.message; break; }
        }
        if (excep) fallos.push(etiqueta + ': ' + excep);
        else if (c.malCheck) fallos.push(etiqueta + ': la solución no pasa su corrector ' + c.malCheck + ' veces en 40');
        else if (c.malTex) fallos.push(etiqueta + ': ' + c.malTex + ' fórmulas con comandos LaTeX desconocidos');
        else if (c.tragaTodo) fallos.push(etiqueta + ': el corrector acepta respuestas vacías o sin contenido');
        else if (c.malOpc) fallos.push(etiqueta + ': la solución no está entre las opciones que se ofrecen');
        else if (c.malErr) fallos.push(etiqueta + ': un «error típico» salta con la respuesta correcta');
        else if (c.decimales) fallos.push(etiqueta + ': pide ' + c.decimales + ' ' + U.plural(c.decimales, 'decimal', 'decimales') + ' pero su tolerancia rechazaría una respuesta bien redondeada; declara dec: ' + c.decimales);
        else if (c.otros.length) fallos.push(etiqueta + ': ' + c.otros[0]);
      });
      return fallos;
    }

    function build() {
      var html = '', malos = 0;
      var host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-9999px;top:0;width:760px';
      document.body.appendChild(host);
      ids.forEach(function (t) {
        if (!reg[t.id]) {
          if (existe[t.id]) {
            malos++;
            html += '<div class="ko">✗ ' + t.id + ' — el archivo existe pero no llega a registrarse: ' +
              'seguramente tiene un error de sintaxis. Ábrelo en el navegador y mira la consola.</div>';
          }
          return;                                     // si no existe, es que aún no está escrito
        }
        escritos++;
        var h = document.createElement('div');
        host.appendChild(h);
        try {
          var pg = new Page(h, t);
          reg[t.id](pg);
          var aud = auditar(pg.specs);
          // Una comprobación sin opción correcta, o con una opción sin
          // explicación, deja al alumno sin saber por qué. Y un ejemplo
          // resuelto de un solo paso no es un ejemplo resuelto.
          pg.checks.forEach(function (c, i) {
            var buenas = c.opts.filter(function (o) { return o.ok; }).length;
            if (!buenas) aud.push('comprobación ' + (i + 1) + ' sin opción correcta');
            if (c.opts.length < 2) aud.push('comprobación ' + (i + 1) + ' con una sola opción');
            if (c.opts.some(function (o) { return !o.por; })) aud.push('comprobación ' + (i + 1) + ' con opciones sin explicación');
          });
          pg.ejemplos.forEach(function (e, i) {
            if (e.pasos.length < 2) aud.push('ejemplo resuelto ' + (i + 1) + ' con menos de dos pasos');
          });
          // Los ejercicios se ordenan de básico a avanzado: un salto atrás
          // en la dificultad descoloca, y uno hacia delante sin escalón, también.
          var NIV = { basico: 1, medio: 2, avanzado: 3 }, ant = 0, desorden = false;
          pg.specs.forEach(function (s) {
            var n = NIV[s.level] || 2;
            if (n < ant) desorden = true;
            ant = n;
          });
          if (desorden) aud.push('los ejercicios no van de básico a avanzado');
          // Ninguna gráfica de escala 1:1 puede recortar la ventana que pidió
          // su autor: si lo hiciera, se comería parte del dibujo.
          var recortadas = [];
          [].forEach.call(h.querySelectorAll('canvas'), function (c, i) {
            var g = c.__plot;
            if (!g || !g.equal || !g._req) return;
            var r = g._req, e = 1e-6;
            if (g.xmin > r[0] + e || g.xmax < r[1] - e ||
                g.ymin > r[2] + e || g.ymax < r[3] - e) recortadas.push(i + 1);
          });
          if (recortadas.length) {
            aud.push('gráfica(s) ' + recortadas.join(', ') + ' recortan su propio encuadre');
          }
          // Ningún punto que se pueda arrastrar puede quedar fuera del alcance
          // del teclado: quien no usa ratón tiene que poder moverlo igual.
          var sinTeclado = [];
          [].forEach.call(h.querySelectorAll('canvas'), function (c, i) {
            var g = c.__plot;
            if (!g || !g._movibles || !g._movibles().length) return;
            conPuntos++;
            if (c.tabIndex !== 0 || !g._voz) sinTeclado.push(i + 1);
          });
          if (sinTeclado.length) {
            aud.push('gráfica(s) ' + sinTeclado.join(', ') + ' solo se pueden usar con el ratón');
          }
          // Un <canvas> sin nombre no existe para un lector de pantalla.
          var anonimas = [];
          [].forEach.call(h.querySelectorAll('canvas'), function (c, i) {
            var n = c.getAttribute('aria-label');
            if (!c.getAttribute('role') || !n || n.length < 12) anonimas.push(i + 1);
          });
          if (anonimas.length) {
            aud.push('gráfica(s) ' + anonimas.join(', ') + ' sin nombre accesible');
          }
          // Un shader que no compila deja un recuadro vacio con un error rojo
          // justo donde el tema promete una imagen. Se compila aqui el codigo
          // original de cada visor, con sus mandos, antes de que nadie lo abra.
          [].forEach.call(h.querySelectorAll('.shd'), function (sh, i) {
            var v = sh.__shd;
            if (!v || !W.glslCompila) return;
            var r = W.glslCompila(v.original, v.mandos);
            if (r.sinWebgl) return;
            if (!r.ok) {
              aud.push('shader ' + (i + 1) + ' no compila: ' +
                r.errores.slice(0, 2).map(function (e) {
                  return 'línea ' + e.linea + ', ' + e.msg;
                }).join(' · '));
            }
          });
          // El coloreado es una capa DEBAJO del textarea: si las dos dejan de
          // medir igual, el cursor se separa de la letra y escribir se vuelve
          // imposible. Aqui se comparan las propiedades que deciden esa medida.
          // paddingBottom no esta en la lista a proposito: el visor lo ajusta
          // para compensar la barra de desplazamiento del textarea, y eso no
          // mueve ninguna letra. Lo que si importa es que la capa llegue tan
          // abajo como el texto, y eso se comprueba justo despues.
          var METRICAS = ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight',
            'letterSpacing', 'wordSpacing', 'paddingTop', 'paddingLeft',
            'borderTopWidth', 'borderLeftWidth', 'whiteSpace', 'tabSize',
            'textIndent'];
          [].forEach.call(h.querySelectorAll('.shd__caja'), function (caja, i) {
            var cp = caja.querySelector('.shd__pinta'), ce = caja.querySelector('.shd__ed');
            if (!cp || !ce) { aud.push('editor ' + (i + 1) + ' sin capa de color'); return; }
            var a = getComputedStyle(cp), b = getComputedStyle(ce), mal = [];
            METRICAS.forEach(function (k) { if (a[k] !== b[k]) mal.push(k); });
            if (mal.length) {
              aud.push('editor ' + (i + 1) + ': la capa de color no mide igual que el ' +
                'textarea (' + mal.join(', ') + ')');
            }
            // Si la capa tiene menos recorrido que el textarea, al llegar al
            // final del codigo el color se separa de la letra.
            var recTa = ce.scrollHeight - ce.clientHeight;
            var recCp = cp.scrollHeight - cp.clientHeight;
            if (recCp + 0.5 < recTa) {
              aud.push('editor ' + (i + 1) + ': la capa de color se queda ' +
                (recTa - recCp).toFixed(0) + ' px corta al final del texto');
            }
          });
          // El coloreado no puede perder ni cambiar un solo caracter: es la
          // letra que el alumno ve mientras escribe.
          [].forEach.call(h.querySelectorAll('.shd'), function (sh, i) {
            var v = sh.__shd;
            if (!v || !W.glslPinta) return;
            var caja = document.createElement('div');
            caja.innerHTML = W.glslPinta(v.original, v.mandos);
            if (caja.textContent !== v.original) {
              aud.push('el coloreado del shader ' + (i + 1) + ' altera el texto');
            }
          });
          // Un shader puede compilar perfectamente y pintar un rectangulo de
          // un solo color: un fallo mudo que ninguna otra prueba ve. Se pinta
          // cada ejemplo fuera de pantalla y se mira si tiene algo dentro.
          [].forEach.call(h.querySelectorAll('.shd'), function (sh, i) {
            var v = sh.__shd;
            if (!v || !W.glslEstadisticas) return;
            var st = W.glslEstadisticas(v.original, v.mandos, { tam: 32, t: 1.7 });
            if (!st) return;                       // no compila: ya avisa la prueba de arriba
            if (st.desv < 2.0) {
              aud.push('shader ' + (i + 1) + ' pinta una imagen lisa (desviacion ' +
                st.desv.toFixed(2) + ' sobre 255)');
            }
          });
          // Un enlace entre capitulos que apunta a un tema inexistente deja al
          // alumno en una pagina en blanco justo cuando iba a repasar algo.
          var rotos = [];
          [].forEach.call(h.querySelectorAll('a.xref'), function (a2) {
            var destino = (a2.getAttribute('href') || '').replace(/^#[/]/, '');
            if (!destino || !idsCurso[destino]) rotos.push(destino || '(vacio)');
          });
          if (rotos.length) aud.push('enlace(s) a temas que no existen: ' + rotos.join(', '));
          // Lo que cambia solo tiene que anunciarse.
          var mudos = h.querySelectorAll('.readout:not([aria-live]), .verdict:not([aria-live])').length;
          if (mudos) aud.push(mudos + ' panel(es) que cambian sin anunciarse');
          // Ninguna fórmula ni etiqueta puede salirse por arriba o por abajo
          // de su caja: si se sale, el navegador la corta y deja de leerse.
          var fuera = 0;
          [].forEach.call(h.querySelectorAll('.fbox'), function (b) {
            var rb = b.getBoundingClientRect();
            if (!rb.height) return;
            // El globo de ayuda es un panel flotante: cuelga por debajo de la
            // caja a proposito, y no cuenta como formula que se sale.
            [].forEach.call(b.querySelectorAll('.mx, .fbox__lab'), function (m) {
              if (m.closest && m.closest('.fbox__tip')) return;
              // El globo de «cómo se lee» vive fuera de la caja a propósito.
              if (m.closest('.fbox__tip')) return;
              var rm = m.getBoundingClientRect();
              if (rm.top < rb.top - 0.5 || rm.bottom > rb.bottom + 0.5) fuera++;
            });
          });
          if (fuera) aud.push(fuera + ' fórmula(s) o etiqueta(s) se salen de su caja');
          // Como el scroll horizontal fuerza overflow-y:auto, una fórmula que
          // sobresalga un par de píxeles del renglón saca una barra vertical
          // que no sirve para nada. No debe haber ninguna.
          var barras = 0;
          [].forEach.call(h.querySelectorAll('.fbox > div:not(.fbox__tip)'), function (d) {
            if (d.scrollHeight > d.clientHeight) barras++;
          });
          if (barras) aud.push(barras + ' línea(s) de fórmula sacan barra de scroll vertical');
          // fórmulas de la explicación (las que no pasan por los ejercicios)
          var malas = h.querySelectorAll('.mx-err');
          if (malas.length) {
            var vistos = [];
            [].forEach.call(malas, function (e) {
              if (vistos.indexOf(e.textContent) < 0) vistos.push(e.textContent);
            });
            aud.push('comandos LaTeX desconocidos en el texto: ' + vistos.join(' '));
          }
          if (aud.length) {
            malos++;
            html += '<div class="ko">✗ ' + t.id + ' — ' + aud.join(' · ') + '</div>';
          } else {
            html += '<div class="ok">✓ ' + t.id + ' — ' +
              h.querySelectorAll('.card--demo').length + ' ejemplos, ' +
              h.querySelectorAll('.card--res').length + ' resueltos, ' +
              h.querySelectorAll('.chk').length + ' comprobaciones, ' +
              h.querySelectorAll('.card--ex').length + ' ejercicios (auditados), ' +
              h.querySelectorAll('canvas').length + ' gráficas</div>';
          }
        } catch (e) {
          malos++;
          html += '<div class="ko">✗ ' + t.id + ' — ' + e.message + '</div>';
        }
      });
      host.remove();
      box.innerHTML = '<div style="margin-bottom:6px;color:var(--ink-soft)">' + escritos +
        ' temas escritos de ' + ids.length + ' previstos' +
        (malos ? ' · <b style="color:var(--bad)">' + malos + ' con errores</b>' : ' · todos se construyen bien') +
        ' · ' + conPuntos + ' gráficas con puntos móviles, todas manejables con el teclado' +
        '</div>' + html;
    }
  })();

  /* ---------------- muestrario visual ---------------- */
  var gal = document.getElementById('gal');
  TEX.forEach(function (t) {
    var d = document.createElement('div');
    d.innerHTML = '<code>' + t.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</code>' + MathX.display(t);
    gal.appendChild(d);
  });
})();
</script>
</body>
</html>
