<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matebase · curso interactivo de matemáticas</title>
<meta name="description" content="Curso interactivo de matemáticas desde la aritmética básica hasta los sistemas dinámicos. Funciona sin conexión y sin servidor.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f5bd9'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia,serif' font-style='italic' fill='white' text-anchor='middle'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/math.css">
</head>
<body>

<div class="app">

  <!-- ================= ÍNDICE ================= -->
  <aside class="side">
    <div class="side__head">
      <div class="brand">
        <a class="brand__mark" href="#" id="homeLink">
          <span class="brand__logo">∫</span>
          <span class="brand__name">Matebase</span>
        </a>
        <a class="brand__home" id="homeBtn" href="#" title="Volver al índice del curso">⌂ <span>Inicio</span></a>
      </div>
      <div class="search">
        <span class="search__icon">⌕</span>
        <input id="search" type="search" placeholder="Buscar un tema…" autocomplete="off" spellcheck="false">
        <button class="search__clear" id="searchClear" type="button" title="Limpiar">×</button>
      </div>
    </div>

    <nav class="side__scroll" id="sideScroll"></nav>

    <div class="side__foot">
      <div class="themes" id="themes" role="group" aria-label="Tema de color"></div>
      <div class="themes themes--letra" id="letras" role="group" aria-label="Tamaño de la letra"></div>
      <div class="side__foot-row">
        <span class="side__by">Diseñado por
          <a href="https://gcarbonell.com" target="_blank" rel="noopener noreferrer">G. Carbonell</a>
        </span>
        <button class="mini" id="resetBtn" type="button" title="Borrar el progreso guardado">Reiniciar</button>
      </div>
    </div>
  </aside>

  <div class="scrim"></div>

  <!-- ================= CONTENIDO ================= -->
  <main class="main" id="main">
    <div class="topbar">
      <button class="burger" id="burger" type="button" aria-label="Índice">☰</button>
      <div class="topbar__crumb" id="crumb"></div>
      <button class="topbar__glos" id="glosBtn" type="button" aria-expanded="false"
              aria-controls="glos" title="Mostrar u ocultar el glosario">
        ▤ <span>Glosario</span>
      </button>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>

  <!-- ================= GLOSARIO ================= -->
  <aside class="glos" id="glos" aria-label="Glosario de términos">
    <div class="glos__head">
      <span class="glos__title">Glosario</span>
      <button class="glos__x" id="glosClose" type="button" aria-label="Ocultar el glosario">×</button>
      <div class="search search--glos">
        <span class="search__icon">⌕</span>
        <input id="glosSearch" type="search" placeholder="Buscar un término…" autocomplete="off" spellcheck="false">
        <button class="search__clear" id="glosClear" type="button" title="Limpiar">×</button>
      </div>
      <div class="glos__count" id="glosCount"></div>
    </div>
    <div class="glos__scroll" id="glosList"></div>
  </aside>

</div>

<!-- ============ núcleo (orden obligatorio) ============ -->
<script src="assets/js/core/util.js"></script>
<script src="assets/js/core/mathx.js"></script>
<script src="assets/js/core/mathlib.js"></script>
<script src="assets/js/core/widgets.js"></script>
<script src="assets/js/core/progress.js"></script>
<script src="assets/js/core/exercise.js"></script>
<script src="assets/js/core/page.js"></script>
<!-- ============ temario y vocabulario ============ -->
<script src="assets/js/curriculum.js"></script>
<script src="assets/js/glosario.js"></script>
<!-- ============ arranque (los temas se cargan solos al abrirlos) ============ -->
<script src="assets/js/core/app.js"></script>

</body>
</html>
